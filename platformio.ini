; PlatformIO project configuration
; M5Stack CoreS3 (K128) posture alert device
;
; Library versions are pinned on purpose (see AGENTS rule: pin every dependency).

[env:m5stack-cores3]
platform = espressif32@6.9.0
board = m5stack-cores3
framework = arduino

; CoreS3 has 16MB flash + 8MB PSRAM, and that PSRAM is *quad* SPI.
; Measured on hardware via ESP.getPsramSize():
;   qio_qspi -> 8386231 bytes   (correct)
;   qio_opi  -> 0 bytes         (PSRAM never initialises, frame buffer falls
;                                back to internal RAM and starves the Wi-Fi stack)
; This matches the builder default, but it is stated explicitly so the next
; person does not "fix" it to qio_opi on the assumption that N16R8 means octal.
board_build.arduino.memory_type = qio_qspi

; CoreS3 flashes over the ESP32-S3 built-in USB-Serial/JTAG, where the baud
; rate is a fiction - the link runs at USB speed either way. esptool's default
; jump to 921600 intermittently fails with "No serial data received", so pin it.
upload_speed = 115200

; esptool 4.5.1's RAM stub loader is unreliable over this USB-Serial/JTAG link
; and fails with "Unable to verify flash chip connection". Talking to the ROM
; loader directly is slower but does not drop the connection.
upload_flags = --no-stub

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_flags =
    -DCORE_DEBUG_LEVEL=1

lib_deps =
    m5stack/M5Unified@0.2.7
    bblanchon/ArduinoJson@7.4.3
